services:
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "${KAFKA_EXTERNAL_PORT}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - data-platform
    restart: unless-stopped

  connect:
    image: debezium/connect:3.0.0.Final
    hostname: connect
    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"
      GROUP_ID: "northwind-connect-cluster"
      CONFIG_STORAGE_TOPIC: "northwind_connect_configs"
      OFFSET_STORAGE_TOPIC: "northwind_connect_offsets"
      STATUS_STORAGE_TOPIC: "northwind_connect_statuses"
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      REST_ADVERTISED_HOST_NAME: "connect"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    ports:
      - "${KAFKA_CONNECT_PORT}:8083"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - data-platform
    restart: unless-stopped

  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: northwind-realtime-spark:3.5.9
    hostname: spark
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      PYSPARK_PYTHON: "python3"
      PYSPARK_DRIVER_PYTHON: "python3"
      SPARK_LOCAL_IP: "spark"
    volumes:
      - ./spark/jobs:/opt/northwind/jobs:ro
      - spark_checkpoints:/opt/spark/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command:
      - sleep
      - infinity
    networks:
      - data-platform
    restart: unless-stopped

volumes:
  kafka_data:
  spark_checkpoints:

